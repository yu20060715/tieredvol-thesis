<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="'Microsoft JhengHei','PingFang SC','SimHei',sans-serif">
  <rect width="900" height="640" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#444444"/>
    </marker>
  </defs>
  <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="bold">圖 F7 WC 寫回快取流程（4.2）</text>

  <rect x="380" y="52" width="240" height="40" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="500" y="77" text-anchor="middle" font-size="14" font-weight="bold">bio 到達 map()</text>

  <text x="345" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a73e8">READ</text>
  <line x1="380" y1="72" x2="310" y2="72" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="80" y="58" width="230" height="50" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="195" y="82" text-anchor="middle" font-size="12" font-weight="bold">先 tv_wc_flush()</text>
  <text x="195" y="98" text-anchor="middle" font-size="12">讀序承重牆：不 flush = 讀到舊資料</text>

  <line x1="500" y1="92" x2="500" y2="118" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <polygon points="500,118 650,158 500,198 350,158" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="500" y="151" text-anchor="middle" font-size="12">wc_enabled &amp;&amp; WRITE</text>
  <text x="500" y="166" text-anchor="middle" font-size="12">&amp;&amp; disk_count &gt; 1？</text>

  <line x1="350" y1="158" x2="280" y2="158" stroke="#444444" stroke-width="1.5"/>
  <line x1="280" y1="158" x2="280" y2="266" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="315" y="150" text-anchor="middle" font-size="12" fill="#188038">否 → -EAGAIN</text>

  <rect x="90" y="266" width="280" height="64" rx="6" fill="#e6f4ea" stroke="#188038" stroke-width="1.5"/>
  <text x="230" y="290" text-anchor="middle" font-size="13" font-weight="bold">直接路徑</text>
  <text x="230" y="308" text-anchor="middle" font-size="12">單碟 / 平行提交（3.2.6）</text>
  <text x="230" y="322" text-anchor="middle" font-size="11" fill="#188038">4 K 小寫（bio &lt; chunk）由此繞過 WC</text>

  <line x1="650" y1="158" x2="650" y2="210" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="658" y="190" font-size="12" fill="#b06000">是</text>

  <rect x="450" y="210" width="380" height="44" rx="6" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="640" y="237" text-anchor="middle" font-size="13">依 (segment, stripe_no) 分組入 linked list</text>

  <line x1="640" y1="254" x2="640" y2="272" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="450" y="272" width="380" height="40" rx="6" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="640" y="297" text-anchor="middle" font-size="13">accumulated += bio_size（緩衝）</text>

  <line x1="640" y1="312" x2="640" y2="330" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="450" y="330" width="380" height="128" rx="6" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="475" y="350" font-size="12" font-weight="bold">Flush 時機（4.2.2）：</text>
  <text x="475" y="370" font-size="12">• accumulated ≥ stripe_size → 同步 flush</text>
  <text x="475" y="388" font-size="12">• 條帶切換（stripe_no 改變）→ 先 flush 舊的</text>
  <text x="475" y="406" font-size="12">• 1 jiffy 逾時 → 非同步 flush（system_wq）</text>
  <text x="475" y="424" font-size="12">• 收到 READ → 先 flush（讀序）</text>
  <text x="475" y="442" font-size="12">• device destroy → 強制 flush</text>

  <line x1="640" y1="458" x2="640" y2="476" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="450" y="476" width="380" height="56" rx="6" fill="#e6f4ea" stroke="#188038" stroke-width="1.5"/>
  <text x="640" y="500" text-anchor="middle" font-size="13" font-weight="bold">flush：splice entries → batch</text>
  <text x="640" y="520" text-anchor="middle" font-size="12">每筆重跑平行/單碟路徑 + tv_mirror_handle()</text>

  <rect x="40" y="560" width="820" height="70" rx="6" fill="#f4f6f8" stroke="#5f6368" stroke-width="1.2"/>
  <text x="80" y="582" font-size="12" font-weight="bold" fill="#444444">設計要點：</text>
  <text x="80" y="602" font-size="12" fill="#444444">• 跨條帶邊界的 bio 由 DM 先切半（3.2.5），WC 只緩衝切割後 bio → 每筆 entry 在同一條帶內</text>
  <text x="80" y="620" font-size="12" fill="#444444">• 一致性聲明：WC 為延遲刷盤快取，斷電時緩衝區資料遺失；需嚴格持久性者關閉 wc_enabled（4.2.4）</text>
</svg>

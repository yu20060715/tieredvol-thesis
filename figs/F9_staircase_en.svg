  <text x="450" y="505" text-anchor="middle" font-size="11" fill="#666666">bottleneck returns to disk A (DMI unsaturated); model solo_A×104/64 ≈ 3354 vs measured 3300 (−1.6%)</text>

  <line x1="430" y1="120" x2="558" y2="120" stroke="#d93025" stroke-width="1.5"/>
  <line x1="430" y1="120" x2="430" y2="134" stroke="#d93025" stroke-width="1.5"/>
  <line x1="558" y1="120" x2="558" y2="148" stroke="#d93025" stroke-width="1.5"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect width="900" height="640" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#444444"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold">Figure F3 TieredVol system architecture (data flow &amp; control flow)</text>

  <rect x="250" y="55" width="400" height="42" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="450" y="81" text-anchor="middle" font-size="14">/etc/tieredvol/&lt;name&gt;.conf (INI + CRC32C)</text>

  <line x1="450" y1="97" x2="450" y2="126" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="462" y="116" font-size="11" fill="#666666">ctr() loads, validates (periodic re-read)</text>

  <rect x="300" y="126" width="300" height="36" rx="6" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="450" y="149" text-anchor="middle" font-size="13">meta: segment / weight / disk list</text>

  <line x1="450" y1="162" x2="450" y2="190" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="120" y="190" width="660" height="130" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="1.5"/>
  <text x="140" y="214" font-size="14" font-weight="bold">map() / tv_map_logical() (O(1) table-less mapping, §3.2)</text>

  <rect x="140" y="228" width="300" height="76" rx="4" fill="#ffffff" stroke="#188038" stroke-width="1"/>
  <text x="150" y="250" font-size="13" font-weight="bold">WRITE</text>
  <text x="150" y="272" font-size="12">cross-disk → per-disk sub-bio (parallel submit)</text>
  <text x="150" y="292" font-size="12">bio &lt; chunk → WC buffer (§4.2)</text>

  <rect x="460" y="228" width="300" height="76" rx="4" fill="#ffffff" stroke="#188038" stroke-width="1"/>
  <text x="470" y="250" font-size="13" font-weight="bold">READ</text>
  <text x="470" y="272" font-size="12">single disk → DM remaps back to original bio</text>
  <text x="470" y="292" font-size="12">cross-disk → split then parallel read</text>

  <line x1="450" y1="320" x2="450" y2="348" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="120" y="348" width="660" height="42" rx="6" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
  <text x="450" y="375" text-anchor="middle" font-size="13">completion callback end_io(): counting / errors / bad-block / mirror retry</text>

  <line x1="175" y1="390" x2="175" y2="440" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="325" y1="390" x2="325" y2="440" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="475" y1="390" x2="475" y2="440" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="625" y1="390" x2="625" y2="440" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="775" y1="390" x2="775" y2="440" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="110" y="440" width="130" height="56" rx="6" fill="#d3e3fd" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="175" y="466" text-anchor="middle" font-size="13" font-weight="bold">disk 0</text>
  <text x="175" y="484" text-anchor="middle" font-size="11">A (NVMe)</text>

  <rect x="260" y="440" width="130" height="56" rx="6" fill="#d3e3fd" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="325" y="466" text-anchor="middle" font-size="13" font-weight="bold">disk 1</text>
  <text x="325" y="484" text-anchor="middle" font-size="11">B (NVMe)</text>

  <rect x="410" y="440" width="130" height="56" rx="6" fill="#d3e3fd" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="475" y="466" text-anchor="middle" font-size="13" font-weight="bold">disk 2</text>
  <text x="475" y="484" text-anchor="middle" font-size="11">C (SSD)</text>

  <rect x="560" y="440" width="130" height="56" rx="6" fill="#d3e3fd" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="625" y="466" text-anchor="middle" font-size="13" font-weight="bold">disk 3</text>
  <text x="625" y="484" text-anchor="middle" font-size="11">D (HDD)</text>

  <rect x="710" y="440" width="130" height="56" rx="6" fill="#fde9d9" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="775" y="466" text-anchor="middle" font-size="13" font-weight="bold">mirror</text>
  <text x="775" y="484" text-anchor="middle" font-size="11">= C (§4.3)</text>

  <text x="130" y="540" font-size="12" fill="#444444">Control flow (out-of-band): dmsetup message (rebuild / borrow_verify), status (counters)</text>
  <text x="130" y="560" font-size="12" fill="#444444">Counters (per-disk wr=/rd= bytes, err, borrow, mirror_*) → evidence basis for Chapter 6</text>
  <text x="130" y="580" font-size="12" fill="#444444">Locks: pending-write/read ring + spinlock (§4.4); hardirq path rules see §5.2.2</text>
  <text x="130" y="600" font-size="12" fill="#444444">Config &amp; admin interfaces see §4.5, implementation §5.7; measurement protocol see Appendix A</text>
</svg>

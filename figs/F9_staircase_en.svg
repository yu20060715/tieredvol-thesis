    <text x="80" y="264" text-anchor="end">2000</text>
    <text x="80" y="344" text-anchor="end">1000</text>
    <text x="80" y="424" text-anchor="end">0</text>
  </g>
  <line x1="100" y1="100" x2="100" y2="420" stroke="#444444" stroke-width="1.5"/>
  <line x1="100" y1="420" x2="840" y2="420" stroke="#444444" stroke-width="1.5"/>
  <g stroke="#cccccc" stroke-width="1">

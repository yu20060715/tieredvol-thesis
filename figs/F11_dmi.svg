<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Microsoft JhengHei','PingFang SC','SimHei',sans-serif">
  <rect width="900" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#444444"/>
    </marker>
  </defs>
  <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="bold">圖 F11 PCH DMI 牆示意（B85 平台）</text>

  <rect x="300" y="70" width="300" height="64" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="450" y="100" text-anchor="middle" font-size="15" font-weight="bold">CPU（北橋整合）</text>
  <text x="450" y="120" text-anchor="middle" font-size="12">PCIe3.0 controller</text>

  <rect x="700" y="70" width="180" height="64" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="1.5"/>
  <text x="790" y="98" text-anchor="middle" font-size="14" font-weight="bold">A：WD SN750</text>
  <text x="790" y="118" text-anchor="middle" font-size="12">PCIe3.0 x4（直連 CPU）</text>

  <line x1="600" y1="102" x2="690" y2="102" stroke="#188038" stroke-width="3"/>
  <text x="645" y="92" text-anchor="middle" font-size="12" fill="#188038" font-weight="bold">直連，不經 DMI</text>

  <line x1="450" y1="134" x2="450" y2="246" stroke="#d93025" stroke-width="4"/>
  <line x1="430" y1="134" x2="470" y2="134" stroke="#d93025" stroke-width="4"/>
  <line x1="430" y1="246" x2="470" y2="246" stroke="#d93025" stroke-width="4"/>
  <text x="470" y="195" font-size="13" fill="#d93025" font-weight="bold">DMI 上行 ≈ 1300 MB/s</text>
  <text x="470" y="213" font-size="11" fill="#d93025">（牆：B+C+D 共用此頻寬）</text>

  <rect x="300" y="246" width="300" height="64" rx="8" fill="#f4f6f8" stroke="#5f6368" stroke-width="1.5"/>
  <text x="450" y="276" text-anchor="middle" font-size="15" font-weight="bold">PCH（南橋）</text>
  <text x="450" y="296" text-anchor="middle" font-size="12">PCIe2.0 / SATA controller</text>

  <line x1="450" y1="310" x2="450" y2="356" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="310" x2="150" y2="400" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="310" x2="450" y2="400" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="310" x2="750" y2="400" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="70" y="400" width="160" height="64" rx="8" fill="#d3e3fd" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="150" y="428" text-anchor="middle" font-size="14" font-weight="bold">B：P3 Plus</text>
  <text x="150" y="448" text-anchor="middle" font-size="12">PCIe2.0 x4（PCH）</text>

  <rect x="370" y="400" width="160" height="64" rx="8" fill="#d3e3fd" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="450" y="428" text-anchor="middle" font-size="14" font-weight="bold">C：MX500</text>
  <text x="450" y="448" text-anchor="middle" font-size="12">SATA（PCH）</text>

  <rect x="670" y="400" width="160" height="64" rx="8" fill="#d3e3fd" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="750" y="428" text-anchor="middle" font-size="14" font-weight="bold">D：WD Blue</text>
  <text x="750" y="448" text-anchor="middle" font-size="12">SATA（PCH）</text>

  <rect x="70" y="490" width="760" height="86" rx="6" fill="#fce8e6" stroke="#d93025" stroke-width="1.2"/>
  <text x="90" y="514" font-size="13" fill="#d93025" font-weight="bold">DMI-aware 權重的成因（6.3.4）</text>
  <text x="90" y="536" font-size="12">A 走直連、B/C/D 共走 DMI 上行：把 DMI 當「共享資源」，權重需以 (3.3) 的</text>
  <text x="90" y="556" font-size="12">DMI×w_A/solo_A 計算各碟預算（B+C+D 權重和 ≤ 40.2）；實測 S3 3370 ≤ S2 3547</text>
  <text x="90" y="572" font-size="11" fill="#666666">硬體：a+b 3590 vs a+b+c 3370（8/14 午，見 RESULTS.md）；B@x4+D 主表同因故採 P3 協定</text>
</svg>

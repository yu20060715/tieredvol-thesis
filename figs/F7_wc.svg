<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="'Microsoft JhengHei','PingFang SC','SimHei',sans-serif">
  <rect width="900" height="650" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#444444"/>
    </marker>
  </defs>
  <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="bold">圖 F7 寫入快取（WC）路徑（4.2）</text>

  <rect x="320" y="52" width="260" height="40" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="450" y="77" text-anchor="middle" font-size="14" font-weight="bold">bio 到達 map()</text>

  <line x1="320" y1="72" x2="250" y2="72" stroke="#444444" stroke-width="1.5"/>
  <line x1="250" y1="72" x2="250" y2="98" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="286" y="64" font-size="12" fill="#d93025">READ</text>

  <rect x="120" y="98" width="260" height="54" rx="6" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
  <text x="250" y="122" text-anchor="middle" font-size="13" font-weight="bold">先 tv_wc_flush()</text>
  <text x="250" y="140" text-anchor="middle" font-size="12">讀序承重牆：不 flush = 讀到舊資料</text>

  <line x1="450" y1="92" x2="450" y2="118" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <polygon points="330,118 480,158 330,198 180,158" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="330" y="151" text-anchor="middle" font-size="12">wc_enabled &amp;&amp; WRITE</text>
  <text x="330" y="166" text-anchor="middle" font-size="12">&amp;&amp; disk_count &gt; 1？</text>

  <line x1="300" y1="158" x2="230" y2="158" stroke="#444444" stroke-width="1.5"/>
  <line x1="230" y1="158" x2="230" y2="226" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="260" y="150" font-size="12" fill="#188038">否 → -EAGAIN</text>

  <rect x="90" y="226" width="280" height="64" rx="6" fill="#e6f4ea" stroke="#188038" stroke-width="1.5"/>
  <text x="230" y="250" text-anchor="middle" font-size="13" font-weight="bold">直接路徑</text>
  <text x="230" y="268" text-anchor="middle" font-size="12">單碟 / 平行提交（3.2.6）</text>
  <text x="230" y="282" text-anchor="middle" font-size="11" fill="#188038">4 K 小寫（bio &lt; chunk）由此繞過 WC</text>

  <line x1="390" y1="158" x2="470" y2="158" stroke="#444444" stroke-width="1.5"/>
  <line x1="470" y1="158" x2="470" y2="178" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="150" font-size="12" fill="#b06000">是</text>

  <rect x="460" y="178" width="360" height="44" rx="6" fill="#fdf2e8" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="640" y="205" text-anchor="middle" font-size="13">依 (segment, stripe_no) 分組入 linked list</text>

  <line x1="640" y1="222" x2="640" y2="238" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="460" y="238" width="360" height="40" rx="6" fill="#fdf2e8" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="640" y="263" text-anchor="middle" font-size="13">accumulated += bio_size（緩衝）</text>

  <line x1="640" y1="278" x2="640" y2="294" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="460" y="294" width="360" height="128" rx="6" fill="#fdf2e8" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="475" y="314" font-size="12" font-weight="bold">Flush 時機（4.2.2）：</text>
  <text x="475" y="334" font-size="12">• 累積 ≥ stripe_size → 同步 flush</text>
  <text x="475" y="352" font-size="12">• 換 stripe（新 stripe_no）→ 先 flush 舊的</text>
  <text x="475" y="370" font-size="12">• 1 jiffy 逾時 → 非同步 flush（system_wq）</text>
  <text x="475" y="388" font-size="12">• 收到 READ → 先 flush（讀序）</text>
  <text x="475" y="406" font-size="12">• device destroy → 強制 flush</text>

  <line x1="640" y1="422" x2="640" y2="448" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="460" y="448" width="360" height="56" rx="6" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
  <text x="640" y="472" text-anchor="middle" font-size="13" font-weight="bold">flush：splice entries → batch</text>
  <text x="640" y="492" text-anchor="middle" font-size="12">每筆重跑平行/單碟路徑 + tv_mirror_handle()</text>

  <rect x="60" y="540" width="780" height="80" rx="6" fill="#f4f6f8" stroke="#5f6368" stroke-width="1.2"/>
  <text x="80" y="562" font-size="12" fill="#444444">設計要點：</text>
  <text x="80" y="582" font-size="12" fill="#444444">• 跨條帶邊界的 bio 由 DM 先切半（3.2.5），WC 只緩衝切割後 bio → 每筆 entry 在同一條帶內</text>
  <text x="80" y="600" font-size="12" fill="#444444">• 一致性聲明：WC 為延遲刷盤快取，斷電時緩衝區資料遺失；需嚴格持久性者關閉 wc_enabled（4.2.4）</text>
</svg>

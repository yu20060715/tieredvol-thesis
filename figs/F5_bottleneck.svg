<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Microsoft JhengHei','PingFang SC','SimHei',sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="bold">圖 F5 瓶頸模型幾何示意：T = minᵢ (soloᵢ × ΣW/wᵢ)</text>

  <text x="230" y="62" text-anchor="middle" font-size="14" font-weight="bold">權重失配 [6:1:1:1]（ΣW = 9）</text>
  <text x="670" y="62" text-anchor="middle" font-size="14" font-weight="bold">權重匹配（w ∝ solo，ΣW = 31）</text>

  <g font-size="11">
    <text x="70" y="105" text-anchor="middle">2500</text>
    <text x="70" y="165" text-anchor="middle">2000</text>
    <text x="70" y="225" text-anchor="middle">1500</text>
    <text x="70" y="285" text-anchor="middle">1000</text>
    <text x="70" y="345" text-anchor="middle">500</text>
    <text x="70" y="405" text-anchor="middle">0</text>
    <text x="510" y="105" text-anchor="middle">2500</text>
    <text x="510" y="165" text-anchor="middle">2000</text>
    <text x="510" y="225" text-anchor="middle">1500</text>
    <text x="510" y="285" text-anchor="middle">1000</text>
    <text x="510" y="345" text-anchor="middle">500</text>
    <text x="510" y="405" text-anchor="middle">0</text>
  </g>
  <line x1="90" y1="100" x2="90" y2="400" stroke="#444444" stroke-width="1.5"/>
  <line x1="90" y1="400" x2="400" y2="400" stroke="#444444" stroke-width="1.5"/>
  <line x1="530" y1="100" x2="530" y2="400" stroke="#444444" stroke-width="1.5"/>
  <line x1="530" y1="400" x2="840" y2="400" stroke="#444444" stroke-width="1.5"/>
  <g stroke="#cccccc" stroke-width="1">
    <line x1="90" y1="100" x2="400" y2="100"/><line x1="90" y1="160" x2="400" y2="160"/>
    <line x1="90" y1="220" x2="400" y2="220"/><line x1="90" y1="280" x2="400" y2="280"/>
    <line x1="90" y1="340" x2="400" y2="340"/>
    <line x1="530" y1="100" x2="840" y2="100"/><line x1="530" y1="160" x2="840" y2="160"/>
    <line x1="530" y1="220" x2="840" y2="220"/><line x1="530" y1="280" x2="840" y2="280"/>
    <line x1="530" y1="340" x2="840" y2="340"/>
  </g>

  <g stroke-width="2.5">
    <line x1="100" y1="220" x2="360" y2="220" stroke="#1a73e8" stroke-dasharray="6,4"/>
    <line x1="100" y1="184" x2="360" y2="184" stroke="#f9ab00" stroke-dasharray="6,4"/>
    <line x1="100" y1="130" x2="360" y2="130" stroke="#34a853" stroke-dasharray="6,4"/>
    <line x1="100" y1="292" x2="360" y2="292" stroke="#d93025"/>
    <line x1="540" y1="214" x2="800" y2="214" stroke="#1a73e8" stroke-dasharray="6,4"/>
    <line x1="540" y1="214" x2="800" y2="214" stroke="#f9ab00" stroke-dasharray="6,4"/>
    <line x1="540" y1="214" x2="800" y2="214" stroke="#34a853" stroke-dasharray="6,4"/>
    <line x1="540" y1="214" x2="800" y2="214" stroke="#d93025"/>
  </g>

  <g font-size="12">
    <text x="368" y="216" fill="#1a73e8">A：solo 1000 → ×9/6 = 1500</text>
    <text x="368" y="180" fill="#f9ab00">B：solo 200 → ×9/1 = 1800</text>
    <text x="368" y="126" fill="#34a853">C：solo 250 → ×9/1 = 2250</text>
    <text x="368" y="288" fill="#d93025" font-weight="bold">D：solo 100 → ×9/1 = 900 ← 瓶頸</text>
    <text x="808" y="210" fill="#444444">各碟 soloᵢ×31/wᵢ = 1550 重合</text>
  </g>

  <text x="245" y="436" text-anchor="middle" font-size="12" fill="#d93025" font-weight="bold">min = 最慢碟 D：T ≈ 900（即使 D 只拿 1/9 資料）</text>
  <text x="685" y="436" text-anchor="middle" font-size="12" fill="#188038" font-weight="bold">min = Σsolo = 1550：所有碟同時飽和</text>

  <text x="245" y="470" text-anchor="middle" font-size="12" fill="#666666">權重失配時各線不等高，總吞吐被最矮線（最慢碟）壓住</text>
  <text x="685" y="470" text-anchor="middle" font-size="12" fill="#666666">權重 ∝ solo 時（推論 3.1）各線重合，無瓶頸碟</text>

  <text x="450" y="510" text-anchor="middle" font-size="12" fill="#444444">示意值僅說明幾何；實測：排水態 S4 命中 T = D×9 ≈ 1760（6.3.1）</text>
  <text x="450" y="532" text-anchor="middle" font-size="11" fill="#666666">繪製工具：本檔 SVG（可直用）；量測後可於 pgfplots 重繪版換實測 solo 值</text>
</svg>

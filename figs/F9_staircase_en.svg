  <rect x="130" y="254" width="120" height="166" fill="#1a73e8"/>
  <rect x="320" y="136" width="120" height="284" fill="#188038"/>
  <rect x="510" y="150" width="120" height="270" fill="#f9ab00"/>
  <rect x="700" y="156" width="120" height="264" fill="#d93025"/>

  <g font-size="13" font-weight="bold" text-anchor="middle">
    <text x="190" y="244" fill="#1a73e8">2080</text>
    <text x="380" y="126" fill="#188038">3547</text>
    <text x="570" y="140" fill="#b06000">3370</text>
    <text x="760" y="146" fill="#d93025">3300</text>
  </g>

  <g font-size="12" text-anchor="middle">
    <text x="190" y="448">S1 (1 disk: A)</text>
    <text x="190" y="466">solo 2080</text>
    <text x="380" y="448">S2 (2 disks: A+B)</text>
    <text x="380" y="466">[37:27]</text>
    <text x="570" y="448">S3 (3 disks: A+B+C)</text>

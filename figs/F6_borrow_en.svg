<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect width="900" height="650" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#444444"/>
    </marker>
  </defs>
  <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="bold">Figure F6 Weight-borrowing flow (§4.1)</text>

  <rect x="380" y="52" width="240" height="40" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="500" y="77" text-anchor="middle" font-size="14" font-weight="bold">WRITE bio arrives</text>

  <line x1="500" y1="92" x2="500" y2="110" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <polygon points="500,110 650,150 500,190 350,150" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="500" y="143" text-anchor="middle" font-size="12">disk in-flight ≥ watermark?</text>
  <text x="500" y="158" text-anchor="middle" font-size="12">and write is full-block aligned?</text>

  <line x1="350" y1="150" x2="280" y2="150" stroke="#444444" stroke-width="1.5"/>
  <line x1="280" y1="150" x2="280" y2="218" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="142" text-anchor="middle" font-size="12" fill="#188038">No (majority of I/O)</text>

  <rect x="90" y="218" width="280" height="52" rx="6" fill="#e6f4ea" stroke="#188038" stroke-width="1.5"/>
  <text x="230" y="240" text-anchor="middle" font-size="13" font-weight="bold">Normal path (deterministic)</text>
  <text x="230" y="258" text-anchor="middle" font-size="12">O(1) table-less mapping (§3.2), no lookup cost</text>

  <line x1="650" y1="150" x2="650" y2="210" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="658" y="142" font-size="12" fill="#d93025">Yes (minority)</text>

  <rect x="450" y="210" width="380" height="52" rx="6" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
  <text x="640" y="232" text-anchor="middle" font-size="13" font-weight="bold">Select least-loaded disk</text>
  <text x="640" y="250" text-anchor="middle" font-size="12">exclude self / DEGRADED / no space in borrow region</text>

  <line x1="640" y1="262" x2="640" y2="280" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="450" y="280" width="380" height="44" rx="6" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
  <text x="640" y="307" text-anchor="middle" font-size="13">all-or-nothing allocation in borrow region (block = 128 KB)</text>

  <line x1="640" y1="324" x2="640" y2="342" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="450" y="342" width="380" height="44" rx="6" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
  <text x="640" y="369" text-anchor="middle" font-size="13">write to borrow region (dst_disk, dst_sector)</text>

  <line x1="640" y1="386" x2="640" y2="404" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="450" y="404" width="380" height="48" rx="6" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
  <text x="640" y="426" text-anchor="middle" font-size="13" font-weight="bold">record per-block entry</text>
  <text x="640" y="443" text-anchor="middle" font-size="12">(v2 table 16 B/entry, magic marks the version)</text>

  <line x1="640" y1="452" x2="640" y2="470" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="450" y="470" width="380" height="48" rx="6" fill="#e6f4ea" stroke="#188038" stroke-width="1.5"/>
  <text x="640" y="492" text-anchor="middle" font-size="13" font-weight="bold">read / rewrite (need==0)</text>
  <text x="640" y="509" text-anchor="middle" font-size="12">lookup resolves to the same destination (borrowed closure)</text>

  <text x="230" y="300" text-anchor="middle" font-size="11" fill="#666666">Borrowing sits on top of the deterministic layout as</text>
  <text x="230" y="316" text-anchor="middle" font-size="11" fill="#666666">an exception list (§4.1.3):</text>
  <text x="230" y="332" text-anchor="middle" font-size="11" fill="#666666">normal addresses still use the O(1) formula;</text>
  <text x="230" y="348" text-anchor="middle" font-size="11" fill="#666666">only borrowed blocks go through the lookup table</text>

  <rect x="60" y="530" width="780" height="46" rx="6" fill="#f4f6f8" stroke="#5f6368" stroke-width="1.2"/>
  <text x="80" y="551" font-size="12" fill="#444444">Invariant: a borrowed block is always readable back; borrow_off only stops new borrows, lookup and rewrite do not check</text>
  <text x="80" y="567" font-size="12" fill="#444444">turning the switch off does not affect consistency of already-borrowed data</text>

  <rect x="60" y="586" width="780" height="46" rx="6" fill="#f4f6f8" stroke="#5f6368" stroke-width="1.2"/>
  <text x="80" y="607" font-size="12" fill="#444444">Persistence: saved as &lt;config&gt;.borrow (v2, magic) on remove; loaded at rebuild → addresses stay consistent</text>
  <text x="80" y="623" font-size="12" fill="#444444">(experiment: 4 G write + verify 0 errors, mapping restored after reload, see §6.5)</text>
</svg>

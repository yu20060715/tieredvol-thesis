  <line x1="100" y1="112" x2="840" y2="112" stroke="#1a73e8" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="120" y="104" font-size="11" fill="#1a73e8">S4 冷態 fresh ≈ 3091（P2，參考線）</text>
  <line x1="100" y1="219" x2="840" y2="219" stroke="#188038" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="120" y="211" font-size="11" fill="#188038">排水態穩態 ≈ 2517（P1，參考線）</text>

  <polyline points="130,116 260,128 390,152 520,182 650,204 740,219" fill="none" stroke="#666666" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="770" y="255" font-size="12" fill="#666666" font-weight="bold">佔位：示意衰減形狀，</text>
  <text x="770" y="273" font-size="12" fill="#666666" font-weight="bold">待實測數據填入</text>

  <text x="130" y="480" font-size="11" fill="#666666">SLC 帶狀：短寫先落 SLC、速率高；隨累計寫入量 SLC 耗盡 → 單調衰減 → TLC 穩態平台。</text>
  <text x="130" y="498" font-size="11" fill="#666666">此即「為何必須定義 P1/P2/P3 協定」（6.1.2）的直接證據；數據源 final_s4.sh 逐 GB 記錄點。</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="'Microsoft JhengHei','PingFang SC','SimHei',sans-serif">
  <rect width="900" height="640" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#444444"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold">圖 F3 TieredVol 系統架構（資料流與控制流）</text>

  <rect x="250" y="55" width="400" height="42" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="450" y="81" text-anchor="middle" font-size="14">/etc/tieredvol/&lt;name&gt;.conf（INI + CRC32C）</text>

  <line x1="450" y1="97" x2="450" y2="126" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="462" y="116" font-size="11" fill="#666666">ctr() 載入、驗證（週期 re-read）</text>

  <rect x="300" y="126" width="300" height="36" rx="6" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="450" y="149" text-anchor="middle" font-size="13">meta：segment / weight / disk 清單</text>

  <line x1="450" y1="162" x2="450" y2="190" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="120" y="190" width="660" height="130" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="1.5"/>
  <text x="140" y="214" font-size="14" font-weight="bold">map() / tv_map_logical()（O(1) 無表映射，3.2）</text>

  <rect x="140" y="228" width="300" height="76" rx="4" fill="#ffffff" stroke="#188038" stroke-width="1"/>
  <text x="150" y="250" font-size="13" font-weight="bold">WRITE</text>
  <text x="150" y="272" font-size="12">跨碟 → 每碟 sub-bio（平行提交）</text>
  <text x="150" y="292" font-size="12">bio &lt; chunk → WC 緩衝（4.2）</text>

  <rect x="460" y="228" width="300" height="76" rx="4" fill="#ffffff" stroke="#188038" stroke-width="1"/>
  <text x="470" y="250" font-size="13" font-weight="bold">READ</text>
  <text x="470" y="272" font-size="12">單碟 → DM 重新映射回原 bio</text>
  <text x="470" y="292" font-size="12">跨碟 → 拆分後平行讀取</text>

  <line x1="450" y1="320" x2="450" y2="348" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="250" y="348" width="400" height="42" rx="6" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
  <text x="450" y="375" text-anchor="middle" font-size="13">完成回呼 end_io()：計數 / 錯誤 / 標壞 / mirror retry</text>

  <line x1="175" y1="390" x2="175" y2="440" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="335" y1="390" x2="335" y2="440" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="495" y1="390" x2="495" y2="440" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="655" y1="390" x2="655" y2="440" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="815" y1="390" x2="815" y2="440" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="110" y="440" width="130" height="56" rx="6" fill="#d3e3fd" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="175" y="466" text-anchor="middle" font-size="13" font-weight="bold">disk 0</text>
  <text x="175" y="484" text-anchor="middle" font-size="11">A (NVMe)</text>

  <rect x="270" y="440" width="130" height="56" rx="6" fill="#d3e3fd" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="335" y="466" text-anchor="middle" font-size="13" font-weight="bold">disk 1</text>
  <text x="335" y="484" text-anchor="middle" font-size="11">B (NVMe)</text>

  <rect x="430" y="440" width="130" height="56" rx="6" fill="#d3e3fd" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="495" y="466" text-anchor="middle" font-size="13" font-weight="bold">disk 2</text>
  <text x="495" y="484" text-anchor="middle" font-size="11">C (SSD)</text>

  <rect x="590" y="440" width="130" height="56" rx="6" fill="#d3e3fd" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="655" y="466" text-anchor="middle" font-size="13" font-weight="bold">disk 3</text>
  <text x="655" y="484" text-anchor="middle" font-size="11">D (HDD)</text>

  <rect x="750" y="440" width="130" height="56" rx="6" fill="#fde9d9" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="815" y="466" text-anchor="middle" font-size="13" font-weight="bold">mirror</text>
  <text x="815" y="484" text-anchor="middle" font-size="11">= C (4.3)</text>

  <text x="130" y="540" font-size="12" fill="#444444">控制流（偶發）：dmsetup message（rebuild / borrow_verify）、status（計數器）</text>
  <text x="130" y="560" font-size="12" fill="#444444">計數器（每碟 wr=/rd= bytes、err、borrow、mirror_*）→ 第六章驗證依據</text>
  <text x="130" y="580" font-size="12" fill="#444444">鎖：pending-write/read ring + spinlock（4.4）；hardirq 路徑規則見承重牆（5.2.2）</text>
  <text x="130" y="600" font-size="12" fill="#444444">設定與管理介面見 4.5、實作見 5.7；量測協定與指令見附錄 A</text>
</svg>

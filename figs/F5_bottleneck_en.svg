<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect width="900" height="620" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="bold">Figure F5 Bottleneck-model geometry: T = minᵢ (soloᵢ × ΣW/wᵢ)</text>

  <text x="230" y="62" text-anchor="middle" font-size="14" font-weight="bold">Mismatched weights [6:1:1:1] (ΣW = 9)</text>
  <text x="670" y="62" text-anchor="middle" font-size="14" font-weight="bold">Matched weights (w ∝ solo, ΣW = 31)</text>

  <g font-size="11">
    <text x="70" y="105" text-anchor="middle">2500</text>
    <text x="70" y="165" text-anchor="middle">2000</text>
    <text x="70" y="225" text-anchor="middle">1500</text>
    <text x="70" y="285" text-anchor="middle">1000</text>
    <text x="70" y="345" text-anchor="middle">500</text>
    <text x="70" y="405" text-anchor="middle">0</text>
    <text x="510" y="105" text-anchor="middle">2500</text>
    <text x="510" y="165" text-anchor="middle">2000</text>
    <text x="510" y="225" text-anchor="middle">1500</text>
    <text x="510" y="285" text-anchor="middle">1000</text>
    <text x="510" y="345" text-anchor="middle">500</text>
    <text x="510" y="405" text-anchor="middle">0</text>
  </g>
  <line x1="90" y1="100" x2="90" y2="400" stroke="#444444" stroke-width="1.5"/>
  <line x1="90" y1="400" x2="400" y2="400" stroke="#444444" stroke-width="1.5"/>
  <line x1="530" y1="100" x2="530" y2="400" stroke="#444444" stroke-width="1.5"/>
  <line x1="530" y1="400" x2="840" y2="400" stroke="#444444" stroke-width="1.5"/>
  <g stroke="#cccccc" stroke-width="1">
    <line x1="90" y1="100" x2="400" y2="100"/><line x1="90" y1="160" x2="400" y2="160"/>
    <line x1="90" y1="220" x2="400" y2="220"/><line x1="90" y1="280" x2="400" y2="280"/>
    <line x1="90" y1="340" x2="400" y2="340"/>
    <line x1="530" y1="100" x2="840" y2="100"/><line x1="530" y1="160" x2="840" y2="160"/>
    <line x1="530" y1="220" x2="840" y2="220"/><line x1="530" y1="280" x2="840" y2="280"/>
    <line x1="530" y1="340" x2="840" y2="340"/>
  </g>

  <g stroke-width="2.5">
    <line x1="100" y1="220" x2="360" y2="220" stroke="#1a73e8" stroke-dasharray="6,4"/>
    <line x1="100" y1="184" x2="360" y2="184" stroke="#f9ab00" stroke-dasharray="6,4"/>
    <line x1="100" y1="130" x2="360" y2="130" stroke="#34a853" stroke-dasharray="6,4"/>
    <line x1="100" y1="292" x2="360" y2="292" stroke="#d93025"/>
    <line x1="540" y1="214" x2="800" y2="214" stroke="#1a73e8" stroke-dasharray="6,4"/>
    <line x1="540" y1="214" x2="800" y2="214" stroke="#f9ab00" stroke-dasharray="6,4"/>
    <line x1="540" y1="214" x2="800" y2="214" stroke="#34a853" stroke-dasharray="6,4"/>
    <line x1="540" y1="214" x2="800" y2="214" stroke="#d93025"/>
  </g>

  <g font-size="12">
    <text x="104" y="416" fill="#1a73e8">A: solo 1000 → ×9/6 = 1500</text>
    <text x="104" y="432" fill="#f9ab00">B: solo 200 → ×9/1 = 1800</text>
    <text x="104" y="448" fill="#34a853">C: solo 250 → ×9/1 = 2250</text>
    <text x="104" y="464" fill="#d93025" font-weight="bold">D: solo 100 → ×9/1 = 900 ← bottleneck</text>
    <text x="685" y="416" text-anchor="middle" fill="#444444">all disks: soloᵢ×31/wᵢ coincide at 1550</text>
  </g>

  <text x="245" y="500" text-anchor="middle" font-size="12" fill="#d93025" font-weight="bold">min = slowest disk D: T ≈ 900 (D gets only 1/9 of the data)</text>
  <text x="685" y="500" text-anchor="middle" font-size="12" fill="#188038" font-weight="bold">min = Σsolo = 1550: all disks saturate simultaneously</text>

  <text x="245" y="534" text-anchor="middle" font-size="12" fill="#666666">mismatched weights → unequal lines; pinned by the slowest disk</text>
  <text x="685" y="534" text-anchor="middle" font-size="12" fill="#666666">weights ∝ solo (corollary 3.1): lines coincide, no bottleneck disk</text>

  <text x="450" y="574" text-anchor="middle" font-size="12" fill="#444444">Illustrative values only for geometry; measured: drained S4 hits T = D×9 ≈ 1760 (§6.3.1)</text>
  <text x="450" y="598" text-anchor="middle" font-size="11" fill="#666666">Drawn as this SVG (ready to use); a pgfplots redraw can substitute measured solo values</text>
</svg>
